name: Update external skills

on:
  schedule:
    - cron: "0 0 * * 1" # 毎週月曜 9:00 JST
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update external skills
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "summary<<EOF"
            bash scripts/update-external-skills.sh
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: bot/update-external-skills
          delete-branch: true
          commit-message: "chore: 外部スキルを upstream の最新版に更新"
          title: "chore: 外部スキルを upstream の最新版に更新"
          body: |
            `.agents/external-skills.json` に登録した外部スキルを upstream の最新版に更新しました。

            ${{ steps.update.outputs.summary }}

            差分と upstream の CHANGELOG を確認してからマージしてください。
